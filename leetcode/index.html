<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeetCode 高频题详解</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell">
<aside class="side">
  <h1>LeetCode 高频题详解</h1>
  <p class="sub">codetop 高频面试题，快照 2026-11-04。每题一份 Java 最优解、一句话思路和几张图解。</p>
  <div class="ctl"><span class="t">搜索</span><input type="search" id="q" placeholder="题号或题目名称" autocomplete="off"></div>
  <div class="ctl"><span class="t">难度</span>
    <label><input type="checkbox" name="lv" value="1" checked>简单</label>
    <label><input type="checkbox" name="lv" value="2" checked>中等</label>
    <label><input type="checkbox" name="lv" value="3" checked>困难</label></div>
  <div class="ctl"><span class="t">详解</span>
    <label><input type="radio" name="done" value="all" checked>全部</label>
    <label><input type="radio" name="done" value="1">已完成</label>
    <label><input type="radio" name="done" value="0">待制作</label></div>
  <div class="ctl"><span class="t">标签</span><select id="tag"><option value="">全部</option></select></div>
  <div class="ctl"><span class="t">套路</span><select id="algo"><option value="">全部</option></select></div>
  <div class="progress">详解进度 <b id="p-done">0</b> / <b id="p-total">0</b><div class="bar"><i id="p-bar" style="width:0"></i></div></div>
</aside>
<main class="list">
  <div class="list-head"><h2>条目，按频度从高到低</h2><span class="count" id="count"></span></div>
  <div id="tech-guide" class="tech-guide" hidden></div>
  <table class="entries">
    <thead><tr><th>排名</th><th>题号</th><th>题目</th><th>难度</th><th>频度</th><th>套路</th><th>详解</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>没有符合条件的条目。</div>
</main>
</div>
<script src="assets/index-data.js"></script>
<script src="assets/index.js"></script>
</body>
</html>
